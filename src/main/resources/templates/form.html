<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario de Cliente</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
<main>
    <header class="page-header">
        <div>
            <h1 th:text="${titulo}">Formulario de Cliente</h1>
            <p>Completa los datos para guardar el cliente.</p>
        </div>
    </header>

    <form th:action="@{/Cliente/form}" th:object="${cliente}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" th:field="*{nombre}" required />
        </div>

        <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" th:field="*{apellido}" required />
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" required />
        </div>

        <div class="actions">
            <button type="submit">Guardar cliente</button>
            <a class="button button-secondary" th:href="@{/Cliente/listar}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
