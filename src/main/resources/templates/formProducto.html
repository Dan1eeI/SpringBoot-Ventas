<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario de Producto</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
<main>
    <header class="page-header">
        <div>
            <h1 th:text="${titulo}">Formulario de Producto</h1>
            <p>Registra la información y disponibilidad del producto.</p>
        </div>
    </header>

    <form th:action="@{/Producto/form}" th:object="${producto}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" th:field="*{nombre}" required />
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion" th:field="*{descripcion}" />
        </div>

        <div class="form-group">
            <label for="precio">Precio</label>
            <input type="number" step="0.01" id="precio" th:field="*{precio}" required />
        </div>

        <div class="form-group">
            <label for="stock">Stock</label>
            <input type="number" id="stock" th:field="*{stock}" required />
        </div>

        <div class="actions">
            <button type="submit">Guardar producto</button>
            <a class="button button-secondary" th:href="@{/Producto/listar}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
