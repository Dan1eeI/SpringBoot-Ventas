<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Iniciar sesion</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
<main>
    <header class="page-header">
    <h1 th:text="${titulo}">Iniciar sesion</h1>
    </header>

    <p class="message" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" required />
        </div>

        <div class="form-group">
            <label for="contrasena">Contrasena</label>
            <input type="password" id="contrasena" name="contrasena" required />
        </div>

        <div class="actions">
            <button type="submit">Ingresar</button>
            <a class="button button-secondary" th:href="@{/registro}">Crear cuenta nueva</a>
        </div>
    </form>
</main>
</body>
</html>
